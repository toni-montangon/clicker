<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Car Clicker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row min-vh-100">

      <!-- Logo Boutique en haut à droite -->
      <a href="shop.html" class="position-absolute top-0 end-0 m-3">
        <img src="assets\Garage-logo.png" alt="Boutique" style="width: 70px; height: 70px; cursor: pointer; margin: 15px;">
      </a>

      <!-- Colonne principale (centrée) -->
      <div class="col-md-12 d-flex flex-column align-items-center justify-content-center text-center">
        <h4 class="mb-4 text-white">Kilomètres parcourus : <span id="clickCount" class="text-primary fw-bold">0</span></h4>

        <!-- Barre de progression -->
        <div class="progress w-75 mb-4" style="height: 20px;">
          <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <img id="carImage" src="assets/niv1-golf.webp" alt="Voiture" style="max-height: 400px; cursor: pointer; margin-top: 70px;">
      </div>
    </div>
  </div>

  <!-- Image pour réinitialiser en bas à gauche -->
  <div style="position: fixed; bottom: 20px; left: 20px;">
    <img id="resetButton" src="assets\reinitialiser.png" alt="Réinitialiser" style="width: 75px; height: 75px; cursor: pointer;">
  </div>

  <script src="js/script.js"></script>
</body>
</html>
